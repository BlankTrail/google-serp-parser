name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # From go.mod rather than a number written here: a toolchain named in
          # two places is a toolchain that drifts, and the one that matters is
          # the one a build from source would use.
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # The live tests are behind a build tag, so nothing above compiles them.
      # They rotted unnoticed through a change of one signature: vetting them
      # is what turns "nobody runs these" into "these still build".
      - run: go vet -tags live ./...
      - run: go test -race ./...
      # The linter has to be built with a Go at least as new as the one this
      # module targets, or it refuses to load the config and the step fails
      # before it has read a line of code. So this version follows go.mod
      # upwards rather than sitting still.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
      # Known holes in what this program is built from, checked on every push
      # rather than on the day somebody scans the public repository. It reports
      # only what this code actually reaches, so a hit here is a hit in a code
      # path we ship, not a line in a dependency nobody calls.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # From go.mod rather than a number written here: a toolchain named in
          # two places is a toolchain that drifts, and the one that matters is
          # the one a build from source would use.
          go-version-file: go.mod
      - run: go build ./...
