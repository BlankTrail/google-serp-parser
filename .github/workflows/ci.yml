name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build ./...
      - run: go vet ./...
      # The live tests are behind a build tag, so nothing above compiles them.
      # They rotted unnoticed through a change of one signature: vetting them
      # is what turns "nobody runs these" into "these still build".
      - run: go vet -tags live ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.0.2

  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build ./...
